name: daily counter post

on:
  schedule:
    # GitHub delays or silently drops scheduled runs, so these are retries, not
    # extra posts: post.py exits early once it has posted for the local day.
    - cron: "0 22 * * *"        # 22:00 UTC = 08:00 AEST / 09:00 AEDT (Newcastle morning)
    - cron: "30 23 * * *"       # 09:30 AEST
    - cron: "0 1 * * *"         # 11:00 AEST
    - cron: "0 3 * * *"         # 13:00 AEST - last chance for the same local day
  push:
    paths: ["incidents.yaml"]   # adding an incident → immediate reset post
  workflow_dispatch:
    inputs:
      dry_run:
        description: "dry run (no posting)"
        type: boolean
        default: false
      on_new:
        description: "only post if incidents.yaml gained something, and override the once-a-day guard"
        type: boolean
        default: false

permissions:
  contents: write               # to commit state.json back

concurrency:
  group: incidents            # the detector writes incidents.yaml; don't race it
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: post
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          COUNTER_HANDLE: ${{ vars.COUNTER_HANDLE }}
          COUNTER_CENSOR: ${{ vars.COUNTER_CENSOR }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python post.py --dry-run
          else
            # A push, or a dispatch from the detector, means incidents.yaml may have
            # gained something: post only if it did, but do post even if today's
            # count already went out. Without this a reset found after the daily
            # post is silently swallowed by the once-a-day guard.
            if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event.inputs.on_new }}" = "true" ]; then
              python post.py --on-new
            else
              python post.py
            fi
          fi
      - name: rebuild the public site
        if: github.event.inputs.dry_run != 'true'
        run: python build_site.py

      - name: commit state
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "counter-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json out/*.png site || true
          git diff --cached --quiet && { echo "no state change"; exit 0; }
          git commit -m "state: $(date -u +%F)"
          # the detector pushes to the same branch; rebase rather than fail
          git pull --rebase --autostash
          git push
      - name: alert on failure
        if: failure()
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          PUSHOVER_SOUND: ${{ vars.PUSHOVER_SOUND }}
        run: |
          bash scripts/alert.sh \
            "Counter failed to post" \
            "The daily post errored. The counter will look frozen until this is fixed." \
            1 "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

