name: watchdog

# The alert that matters. GitHub emails you when a workflow fails, but it cannot
# tell you when a workflow never ran - and a dropped cron is the failure this
# account has actually hit. This checks the only thing that counts: did the
# counter post today?
#
# It runs after the daily post's last retry, so a late run is not a false alarm.

on:
  schedule:
    - cron: "0 9 * * *"     # 19:00 AEST - an hour after the last posting retry
    - cron: "0 12 * * *"    # 22:00 AEST - second look before the day is out
  workflow_dispatch:
    inputs:
      test:
        description: "send a test alert and stop"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: test alert
        if: github.event.inputs.test == 'true'
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          PUSHOVER_SOUND: ${{ vars.PUSHOVER_SOUND }}
        run: |
          bash scripts/alert.sh "Counter test alert" \
            "If you can see this, the watchdog can reach your phone. Nothing is wrong." 0
          echo "test only; stopping here"

      - name: has it posted today?
        if: github.event.inputs.test != 'true'
        id: check
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from datetime import date, datetime
          from zoneinfo import ZoneInfo

          today = datetime.now(ZoneInfo("Australia/Sydney")).date()
          try:
              last = date.fromisoformat(json.load(open("state.json"))["last_post_date"])
          except Exception as e:
              print(f"stale=true"); print(f"detail=state.json unreadable: {e}"); raise SystemExit

          behind = (today - last).days
          print(f"stale={'true' if behind >= 1 else 'false'}")
          print(f"detail=last posted {last} ({behind} day(s) ago); today is {today}")

          # Silence is now a legitimate outcome: the daily count is withheld
          # until the detector has read a digest published today. Say which
          # kind of quiet this is, so the alert points at the real cause.
          try:
              s = json.load(open("sweep.json"))
              if s.get("digest_local_date") == today.isoformat():
                  why = "Today's digest is out, so the fault is in the sweep or the post, not the source."
              else:
                  why = (f"AI StopWatch has not published for {today} (last dispatch "
                         f"{s.get('digest_local_date')}), so the count was withheld "
                         f"rather than claim an all-clear nobody checked.")
          except Exception:
              why = "sweep.json is missing, so the detector may not have run at all."
          print(f"why={why}")
          PY

      - name: alert if the counter has gone quiet
        if: steps.check.outputs.stale == 'true'
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          PUSHOVER_SOUND: ${{ vars.PUSHOVER_SOUND }}
        run: |
          bash scripts/alert.sh "Counter has not posted" \
            "${{ steps.check.outputs.detail }}. ${{ steps.check.outputs.why }}" \
            1 "${{ github.server_url }}/${{ github.repository }}/actions"

      - name: say so in the log when all is well
        if: steps.check.outputs.stale == 'false'
        run: echo "OK - ${{ steps.check.outputs.detail }}"
