name: detect incidents

# Autonomous daily sweep. detect.py asks Claude Opus 5 to look for anything a
# frontier AI company has had to apologise for, then applies the evidence bar in
# Python. Findings that clear it are appended to incidents.yaml and the poster is
# dispatched; everything else becomes a review issue.
#
# Runs before the daily post so a same-day reset goes out in place of the count.
# A GITHUB_TOKEN push does not fire daily.yml's push trigger, hence the explicit
# dispatch.

on:
  schedule:
    # AI StopWatch lands in Sydney between 07:36 and 11:07, median 10:10, and
    # GitHub fires crons late and unpredictably. So these are attempts, not
    # sweeps: detect.py checks the feed first and returns without spending
    # anything until the day's dispatch is actually there.
    - cron: "0 22 * * *"        # 08:00 AEST
    - cron: "30 23 * * *"       # 09:30 AEST
    - cron: "0 1 * * *"         # 11:00 AEST
    - cron: "30 2 * * *"        # 12:30 AEST
    - cron: "0 5 * * *"         # 15:00 AEST - last chance for the same local day
  workflow_dispatch:
    inputs:
      dry_run:
        description: "research and report, but change nothing"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: incidents            # never let a sweep and a post race on incidents.yaml
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt

      - name: sweep
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DETECTOR_MODE: ${{ vars.DETECTOR_MODE }}
          DETECTOR_EFFORT: ${{ vars.DETECTOR_EFFORT }}
          DETECTOR_LOOKBACK: ${{ vars.DETECTOR_LOOKBACK }}
          DIGEST_FEED: ${{ vars.DIGEST_FEED }}
        run: |
          # pipefail or `tee` swallows detect.py's exit code and a failed sweep
          # reports success - which is exactly how a dead detector hides.
          set -o pipefail
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python detect.py --dry-run | tee /tmp/sweep.txt
          else
            python detect.py | tee /tmp/sweep.txt
          fi

      # A set-aside finding opens no issue by design, so the run page is where
      # it has to be legible. Free to write, and it means a ruling that fired
      # wrongly is one click away rather than buried in a downloadable artifact.
      - name: note anything an existing ruling set aside
        if: always()
        run: python scripts/summarise_ruled_out.py >> "$GITHUB_STEP_SUMMARY"

      # The full model response, kept for auditing a sweep that got it wrong,
      # alongside anything an existing ruling set aside - which opens no issue,
      # so the artifact is where it stays visible.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detection-${{ github.run_id }}
          path: |
            out/detection.json
            out/ruled-out.json
          if-no-files-found: ignore
          retention-days: 90

      - name: commit and post
        id: commit
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "counter-bot"
          git config user.email "bot@users.noreply.github.com"
          # sweep.json is how post.py knows a human-facing all-clear has been
          # earned. Only commit it on a real sweep - a run that found the
          # digest missing has nothing to report and should leave no trace.
          swept=$(python -c "import json;print(str(json.load(open('sweep.json'))['swept']).lower())" 2>/dev/null || echo false)
          echo "swept=$swept" >> "$GITHUB_OUTPUT"
          # Decide what changed BEFORE committing. Comparing HEAD~1 afterwards
          # reads the wrong pair of commits on a run that committed nothing.
          git add incidents.yaml
          if git diff --cached --quiet -- incidents.yaml; then
            echo "nothing accepted"
          else
            echo "appended=true" >> "$GITHUB_OUTPUT"
          fi
          if [ "$swept" = "true" ]; then
            git add sweep.json
          fi
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "detect: $(date -u +%F)"
            git pull --rebase --autostash
            git push
          fi

      # Post immediately after a sweep rather than waiting for the poster's own
      # cron: the sweep is what unlocks the daily count, so the two should move
      # together. on_new for an append (that is a reset), plain otherwise.
      - name: dispatch the poster
        if: steps.commit.outputs.swept == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.commit.outputs.appended }}" = "true" ]; then
            gh workflow run daily.yml -f dry_run=false -f on_new=true
          else
            gh workflow run daily.yml -f dry_run=false -f on_new=false
          fi

      - name: open a review issue for anything held back
        if: github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(python -c "import json;print(len(json.load(open('out/review.json'))))" 2>/dev/null || echo 0)
          [ "$count" = "0" ] && { echo "nothing held"; exit 0; }
          {
            echo "The sweep found $count thing(s) it could not stand up on its own. Nothing has been posted."
            echo
            echo "Check them, and if one is real, log it through the incident form."
            echo
            echo '```'
            sed -n '/^\[HOLD/,$p' /tmp/sweep.txt
            echo '```'
          } > /tmp/review.md
          gh issue create --title "review: $count held finding(s) $(date -u +%F)" \
                          --label needs-review --body-file /tmp/review.md

      - name: report a failed sweep
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "detector failed $(date -u +%F)" --label needs-review \
            --body "The sweep errored: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} . The counter still posts; it just is not watching until this is fixed."
      - name: alert on failure
        if: failure()
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          PUSHOVER_SOUND: ${{ vars.PUSHOVER_SOUND }}
        run: |
          bash scripts/alert.sh \
            "Detector failed" \
            "The sweep errored. The counter still posts, it just is not watching." \
            1 "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

