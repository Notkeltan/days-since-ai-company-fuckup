# incidents.yaml — the single source of truth for the counter.
#
# HOW THIS WORKS
#   The bot takes the most recent entry with `resets: true`, counts the days
#   since it, and posts the number. Add a new entry → next run posts a RESET.
#   Entries with `resets: false` are logged "honourable mentions" — they show
#   up in the reply thread but don't touch the counter.
#
# FIELDS
#   id        short-slug, unique
#   date      yyyy-mm-dd (date the incident became public, not when it happened
#             in secret — the counter measures what the world could see)
#   company   the org (use the canonical names in README so stats aggregate)
#   category  model_behaviour | security_privacy | governance | deception |
#             safety_process | misuse | legal   (legal is Tier-2-only: lawsuits
#             don't reset the counter, see README)
#   tier      1 = major (resets), 2 = notable (does not reset)
#   resets    true/false  (should always match tier == 1; kept explicit so you
#             can override on a per-case basis)
#   tone      snark | somber   — somber suppresses the joke templates and the
#             "previous record" line. Use it for anything involving a death,
#             a child, or abuse victims.
#   title     ≤ 100 chars, what the sign/tweet says
#   detail    one sentence of context for the reply
#   source    where to find it. PLEASE REPLACE WITH REAL URLs BEFORE GO-LIVE.
#   confidence  Claude's confidence in the date/details as written (high/med/low)
#
# ⚠️ EVERYTHING BELOW WAS WRITTEN FROM CLAUDE'S MEMORY (knowledge cutoff ~Jan 2026).
#    Dates may be off by a day or two and there is a real risk of misremembered
#    details. Verify each line against a primary source before the account goes
#    live — a "fuckup counter" that gets facts wrong is a fuckup counter that
#    gets ratio'd. Entries after 2026-01 came from a quick web-search pass on
#    2026-08-25 and carry real URLs, but the low-confidence ones need a primary source.

